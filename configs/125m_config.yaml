# Architecture Hyperparameters (Calculates to ~124M parameters)
vocab_size: 50257        
hidden_size: 768         
num_hidden_layers: 12    
num_attention_heads: 12  
intermediate_size: 2048  
max_position_embeddings: 512  
initializer_range: 0.02  
rms_norm_eps: 0.00001    
tie_word_embeddings: true

# Training Hyperparameters
batch_size: 8
gradient_accumulation_steps: 16   # 8 x 16 = 128 seqs = 65,536 tokens per step
learning_rate: 0.0005
min_lr: 0.00005
warmup_steps: 1000
max_steps: 45000                  # ~2.95B tokens = one pass over your 3B dataset
weight_decay: 0.1        
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 0.00000001 
max_grad_norm: 1.0       
logging_steps: 10
eval_steps: 1000
eval_batches: 20                  # How many batches to use for validation
checkpoint_minutes: 30            # Save every 30 mins
keep_checkpoints: 2               # Only keep the 2 most recent local files to save disk
time_limit_hours: 11.5            # Kaggle safety kill switch

# File Paths
data_dir: "data/shards"
val_path: "data/val.bin"
output_dir: "checkpoints"
dtype: "float16"
gradient_checkpointing: false     # Turned OFF for 125M (faster!)

# Hugging Face Upload (CRITICAL)
hf_repo: "brain2bits/radix-model" # <--- ADDED THIS! It will upload here.