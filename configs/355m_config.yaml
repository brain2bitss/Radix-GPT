# Architecture Hyperparameters (Calculates to ~298M parameters)
vocab_size: 50257        
hidden_size: 896         # Narrower than 1024 to save VRAM
num_hidden_layers: 20    # Deeper logic
num_attention_heads: 14  # 896 / 14 = 64 head_dim
intermediate_size: 2432  # SwiGLU standard
max_position_embeddings: 1024 
initializer_range: 0.02  
rms_norm_eps: 0.00001    

# Training Hyperparameters
batch_size: 2            
gradient_accumulation_steps: 16 
learning_rate: 0.0003    
weight_decay: 0.1        
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 0.00000001 
max_grad_norm: 1.0       
epochs: 2                
logging_steps: 10
checkpoint_steps: 500

# File Paths
data_path: "data/tokenized/train.bin"
output_dir: "checkpoints"